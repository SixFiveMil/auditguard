[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auditguard"
version = "1.0.0"
description = "Compliance-first, scope-enforced security research & audit automation framework"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "Joshua A. Wortz (Code and Cypher)"}
]
keywords = [
    "security",
    "bug-bounty",
    "vulnerability-assessment",
    "safe-harbor",
    "cvss",
    "scope-enforcement",
    "idor",
    "reconnaissance"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    "fpdf2>=2.8.0",
]

[project.urls]
Homepage = "https://codeandcypher.com"
Documentation = "https://github.com/SixFiveMil/auditguard#readme"
Repository = "https://github.com/SixFiveMil/auditguard"
Publication = "https://codeandcypher.com"
Issues = "https://github.com/SixFiveMil/auditguard/issues"

[project.scripts]
auditguard = "main:main"

[tool.setuptools]
py-modules = ["main"]
packages = ["core", "reporting", "audit"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml"]
